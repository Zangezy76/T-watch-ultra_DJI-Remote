name: Build T-Watch sketch / Release

# Compiles the T-Watch Ultra Arduino sketch with tools/build.py's pinned dependencies
# on every push to main, every pull request and every v* tag. A v* tag also creates
# a GitHub Release from RELEASE_NOTES.md.
#
# No firmware binary is attached: the camera's BLE MAC is compiled into the sketch, so a
# prebuilt .bin would not work with anyone's camera. CI builds with a dummy MAC only to
# prove the sketch compiles.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Compile (dummy camera MAC)
        run: python3 tools/build.py --mac 00:00:00:00:00:01

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
